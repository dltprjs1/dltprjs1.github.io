testimonial6-items:
- image: assets/images/portfolio/AutoTrading/AutoTrading_Main.png
  content: <h4>개별 프로젝트</h4><br>소켓 클라이언트로 데이터를 실시간으로 수집하여 시각화 하는 웹 프로젝트를 개발하였으며 개발 기간 대략 1개월 소요되었습니다.<br>이 프로젝트의 핵심 기능은 소켓과 웹 소켓을 통해 데이터를 실시간으로 처리하는 것이었습니다. <br>서버와 클라이언트 간의 소켓연동 그리고 Bo와 Fo간의 웹 소켓 연동을 설정하여 데이터의 실시간 전송을 구현하였습니다. <br> 이를 통해 사용자는 실시간으로 데이터를 받아 볼 수 있고, 데이터 처리 및 시각화가 가능했습니다. <br> 또한 프로젝트에서는 데이터의 실시간 집계 기능을 구현하였습니다. <br>서버에서 송신되는 데이터를 클라이언트에서 받아 집계하고, 사용자에게 실시간으로 결과를 제공했습니다. <br>이를 통해 사용자는 데이터의 변화를 실시간으로 모니터링할 수 있었습니다.<br> 자동 선물 프로그램에서 발생할 수 있는 오류를 탐지하기 위해 실시간 에러 탐지 기능을 구현했습니다. 에러를 실시간으로 감지하여 사용자에게 알림을 제공하고, 문제가 해결될 때까지 모니터링할 수 있었습니다.<br> 그리고, 자동선물 프로그램에 대한 주문 조건 설정 기능 또한 추가하였습니다.
- image: assets/images/portfolio/AutoTrading/AutoTrading_Charts.png
  content: 차트 페이지 입니다. <br> 1. 30분마다 초기화 및 업데이트 진행 되는 차트 <br> 2. 거래에 따른 보유금액 변동 <br> 3. 금일 에러 분류에 따른 차트로 구성되어 있습니다. 
- image: assets/images/portfolio/AutoTrading/AutoTrading_Table.png
  content: 테이블 페이지 입니다. <br> 1. 거래 이력 상세 확인 <br> 2. 주문 조건 상세 확인 <br> 3. 에러 상세 내역으로 구성 되어 있습니다.   
- image: assets/images/portfolio/Docker_AutoWeb.png
  content: 자동 선물 데이터 처리 서버와 마찬가지로 Docker로 배포하였으며 휴대폰으로도 접속 가능하도록 포트포워딩을 통해 외부에서도 접근 가능하도록 설정 하였습니다.<br> (SK 공유기는 DDNS 서비스가 없어 도메인은 IP:Port로 접근 가능 합니다..)<br> (IPTIME 공유기로 변경 예정)  
  
