testimonial5-items:
- image: assets/images/portfolio/Docker_AutoServer.png
  content: <h4>개별 프로젝트</h4><br>자동선물 프로그램 데이터 처리 서버는 자바로 개발되었으며, 개발 기간 대략 1개월 소요되었습니다.<br> 이 서버는 MyBatis 사용하여 데이터베이스와의 상호작용을 관리하며, <br> 소켓 클라이언트인 자동선물 프로그램에서 수신한 데이터를 가공하여 데이터베이스에 저장 <br> 웹 프로젝트에 실시간으로 자동선물 프로그램의 데이터를 전송합니다.<br> 데이터베이스에 저장하기 전에 데이터베이스 저장 프로시저에서 수신 받은 데이터를 가공하여 데이터 테이블에 알맞게 저장 또는 업데이트되도록 구성하였습니다.
  
