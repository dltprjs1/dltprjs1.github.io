portfolio-home-items:
- title: 이커머스 유지보수
  summary: 실무 프로젝트 / 온오프라인 쿠폰 연동 / 사전예약 서비스 / O2O / 경쟁사 가격비교 데이터 자동 수집 및 알림 / SNS,Tistory 제품 포스팅 자동화
  team: 실무 프로젝트 ( 에이샵 )
  date: 2024.09.24 ~
  tags: [Node.js, NestJS, ERP(Enterprise Browser) API, O2O, AWS EC2, Jenkins, Docker, MySQL]
  contents: <p><b>애플 제품 NPI(New product Introduce)기간 사전예약 시스템 구축</b> Node.js 기반으로 애플 신제품(NPI) 런칭 기간 동안 집중되는 대규모 트래픽을 안정적으로 처리할 수 있는 맞춤형 사전예약 시스템 설계 및 개발.</p><p><b>온·오프라인 회원 통합(O2O)</b> OAuth 2.0 기반의 카카오톡 Permanent Link를 연동하여 오프라인 매장 방문 고객의 온라인 회원가입 절차를 획기적으로 단축. 회원가입 시 오프라인 고객 등록 API 연동으로 ERP 회원 등록 로직 구현. 오프라인 전용 온라인 페이지를 구축하여 고객 편의성을 높이고 온·오프라인 회원 통합(O2O) 유도.</p><p><b>CRM 자동화 및 인프라 구축</b> DirectSend API 기반 카카오 알림톡/SMS 자동 발송 시스템 구축 및 Node.js + AWS S3를 활용한 사내 파일 공유 서버 개발. Jenkins와 Docker를 활용해 CI/CD 파이프라인을 구축하여 배포 프로세스 자동화.</p><p><b>LLM 마케팅 자동 배포 (Tistory/SNS)</b> Claude API를 활용해 자사몰 데이터 기반의 마케팅 콘텐츠를 자동 생성하고, Mac Mini 로컬 서버 환경에서 Tistory API로 무중단 포스팅하는 파이프라인 구축.</p><p><b>경쟁사 데이터 수집 및 실시간 알림</b> 네이버 쇼핑 오픈 API로 애플 제품군 및 경쟁사 최저가 데이터를 수집하고, macOS 네이티브 스케줄러(launchd)와 SMTP를 결합해 가격 변동 시 유관 부서에 즉각 메일을 발송하는 중앙 제어 체계 마련.</p>

- title: 고객 행동 데이터 분석 인사이트 제공
  summary: 실무 프로젝트 / 고객 행동 데이터 기반 이커머스 Traffic, Conversion Funnel, Cohort, Segments, AARRR 마케팅 인사이트 데이터
  team: 실무 프로젝트 ( 에이샵 )
  date: 2024.09.24 ~
  tags: [Saleforce CDP, BigQuery, Tableau, Python, Pandas]
  contents: <p>이커머스 전 페이지에 고객 행동 데이터 기반 CDP 스크립트를 심어 사용자 이벤트 추적 환경 커스터마이징.</p><p>수집된 데이터를 BigQuery와 연동하고 Tableau로를 활용하여 OneScan Traffic(PV,UV,SCAN), OneLine Traffic, Conversion Funnel, Cohort, Segments, AARRR 등 비즈니스 대시보드 구축 및 데이터 추출 쿼리 구축.</p>

- title: POS/무인포스 실시간 관제 및 CRM 연동 시스템
  summary: 실무 프로젝트 / 실시간 관제 소켓 서버 / 소켓 클라이언트 / WebSocket 관제 웹 페이지 / CRM 연동 운영 자동화
  team: 실무 프로젝트 ( 넷틴스 )
  date: 2023.03 ~ 2024.03
  tags: [Java, Socket, WebSocket, Mybatis, MSSQL, Delphi, C++, windows Server]
  contents: <p><b>실시간 모니터링 서버 설계 및 구축</b> 전국 다이소 가맹점에 설치된 POS/무인포스 단말기와 연동하기 위해 결제 프로그램(C++) 및 포스(Delphi) 클라이언트와 통신하는 Java Socket 서버 로직을 구현. 각 매장의 에러 코드 및 기기 상태 데이터를 실시간으로 수집·처리하는 안정적인 데이터 파이프라인 구축.</p><p><b>대용량 데이터 처리를 위한 DB 스키마 최적화</b> 전국 가맹점으로부터 월평균 100만 건 이상 유입되는 대용량 트랜잭션 데이터를 안정적으로 적재하고 조회할 수 있도록, 인덱스(Index) 전략을 적용한 MSSQL 스키마를 설계하여 데이터 처리 성능 최적화.</p><p><b>실시간 관제 대시보드 개발</b> WebSocket과 Kakao Map API를 연동하여 전국 다이소 가맹점의 기기 에러 상태를 지도 기반으로 시각화한 실시간 관제 웹 대시보드 구축. 담당자가 전국 단위의 장애 현황을 한눈에 파악하고 즉각 대응할 수 있는 운영 환경 제공.</p><p><b>CRM 연동을 통한 운영 자동화</b> 특정 기기에서 에러가 반복 감지될 경우 CRM 시스템에 자동으로 문의·접수되도록 연동 로직을 구현, 수동 접수 프로세스를 제거하여 유지보수 대응 속도 및 운영 효율성을 획기적으로 개선.</p>

- title: 알리페이 VAN사 결제 서비스 연동
  summary: 실무 프로젝트 / VAN사 알리페이 결제 서비스 연동 / 결제 내역 및 영수 프로세스 개발
  team: 실무 프로젝트 ( 넷틴스 )
  date: 2023.10 ~ 2023.12
  tags: [Delphi, Epson Print]
  contents: <p>VAN사 모듈 기반 알리페이 결제/취소 및 영수증 처리 전문 통신 로직 구현. 결제기기 연동 상태를 체크하고 장애 시 자동 재연동 및 로그를 기록하는 안정화 로직 구축.</p>

- title: 자동 매매 풀 서비스 개발 (+ Zabbix 모니터링)
  summary: 토이 프로젝트 / 자동매매 / 데이터 파이프라인 Socket 서버 / 실시간 데이터 시각화 웹페이지 / Oauth2.0 / JWT 인증 서비스 / Zabbix 서버 모니터링 및 자동화
  team: 토이 프로젝트 ( 1인 개발 )
  date: 2024.05.01 ~
  tags: [Python, Java, MSSQL, PostgreSQL, JPA, Mybatis, Windows Server, Linux, Docker Desktop, Socket, RestAPI, Qauth2, JWT, Pandas, SSL, DNS, DDNS]
  contents: <p><b>Full-Cycle 매매 인프라 및 DB 파이프라인</b> Python 기반의 자동 매매 로직(Binance API)과 Java 백엔드를 Socket 통신으로 연동하고, 수백만 건의 실시간 거래 및 호가 데이터를 MSSQL에 가공·적재하는 데이터 파이프라인 구축 및 Docker 배포.</p><p><b>엔터프라이즈급 API 보안 및 인증 체계</b> Spring Security와 OAuth 2.0을 도입하여 관제 웹 접근 시 자체/소셜 로그인(카카오, 네이버) 기반의 인증 서버 구현. Access/Refresh Token(JWT) 체계를 통해 프론트엔드와 백엔드 간 API 통신 전 구간의 보안성 및 무결성 검증 로직 적용.</p><p><b>실시간 관제 대시보드</b> 보안 인증을 통과한 관리자가 실시간 주문 데이터와 자산 수익률 지표를 한눈에 파악할 수 있도록, React와 WebSocket을 활용한 반응형 웹 대시보드 시각화.</p><p><b>Server Monitoring</b> Zabbix Server/Proxy 배포 및 에이전트(SNMP 등) 연동을 통해 모니터링 환경을 구축. DNS 및 DDNS 설정을 적용하여 대시보드의 외부 접근성을 확보하고, Lets Encrypt 기반의 무료 SSL 인증서 적용. 특정 어플리케이션 에러 발생 시 Shell Script가 트리거되어 자동 복구되도록 시스템 운영을 자동화</p>

