testimonial3-items:
- image: assets/images/portfolio/AutoTrading/Server.png
  content: <h4>개별 프로젝트</h4><br> 자동 선물 프로그램은 파이썬을 사용하여 개발되었으며., 개발 기간 대략 2개월 소요되었습니다. <br> 해당 프로그램은 binanceAPI를 통한 설정 코인의 데이터를 추출 하여 사용자가 설정한 주문 조건에 따라 자동으로 주문을 처리합니다. <br> 프로그램은 소켓 클라이언트를 통해 서버에 주문 정보 및 관련 데이터를 안전하게 전송하며,<br> 이를 통해 사용자는 번거로운 주문 과정을 자동화하여 주문 시간을 절약할 수 있으며, 설정한 조건에 맞추어 자동으로 주문이 처리되기 때문에 사용자의 편의성을 높일 수 있습니다.<br> 또한 소켓 통신을 활용하여 서버와의 데이터 교환을 실시간으로 처리하고 있습니다.<br>해당 프로그램에서 사용한 대표적인 라이브러리는 다음과 같습니다.<br><button type="button" class="btn btn-secondary btn-sm">binance.client</button> <button type="button" class="btn btn-secondary btn-sm">socket</button> <button type="button" class="btn btn-secondary btn-sm">pandas</button> <button type="button" class="btn btn-secondary btn-sm">threading</button> <button type="button" class="btn btn-secondary btn-sm">logging</button>

