blurb:
- blurb-title: Backend
  blurb-content: 대규모 트래픽과 실시간 데이터를 제어하는 견고한 아키텍트 백엔드 개발자로서 저의 가장 큰 강점은 비즈니스의 핵심 요구사항을 정확히 파악하고, 이를 안정적이고 확장 가능한 아키텍처로 구현해 내는 실행력에 있습니다. 단순히 기능이 동작하는 코드를 작성하는 것을 넘어, 대규모 트래픽과 실시간 데이터를 지연 없이 처리할 수 있는 견고한 시스템을 설계하는 데 깊은 열정을 가지고 있습니다. 에이샵(Ashop) 재직 시에는 Node.js를 기반으로 애플 신제품(NPI) 런칭 기간에 집중되는 대규모 트래픽을 거뜬히 소화하는 맞춤형 사전예약 시스템을 성공적으로 구축하여 서비스의 기술적 안정성을 증명했습니다. 또한, O2O 기반의 회원가입 프로세스를 최적화하기 위해 OAuth 2.0 기반 카카오톡 연동을 주도하여 오프라인 고객의 온라인 전환율과 편의성을 획기적으로 끌어올렸습니다. 이전 주식회사 넷틴스에서는 전국 다이소 가맹점의 POS 단말기 및 결제 프로그램과 통신하는 Java Socket 및 WebSocket 서버를 직접 설계 및 개발하여, 전국 단위의 실시간 장애 관제 파이프라인을 완성한 경험이 있습니다. 나아가 개인 프로젝트로 진행한 코인 자동매매 플랫폼에서는 Spring Security와 JWT를 활용해 엔터프라이즈급 API 보안 및 인증 체계를 직접 설계하며 아키텍처 전반에 대한 이해도를 넓혔습니다. 이처럼 저는 Java, Spring, Node.js, Python 등 다양한 언어와 프레임워크를 적재적소에 활용하여, 어떠한 비즈니스 환경에서도 최적의 백엔드 솔루션을 제공할 수 있는 준비된 엔지니어입니다.
  
- blurb-title: Infrastructure
  blurb-content: 무중단 서비스를 위한 CI/CD 및 자동화 파이프라인 마스터 개발된 서비스가 사용자에게 끊김 없이, 그리고 가장 빠르게 도달할 수 있도록 인프라 환경을 구축하고 운영 프로세스를 자동화하는 작업은 제가 각별히 애정을 쏟는 분야입니다. 서비스의 성장은 필연적으로 시스템의 확장을 요구하기에, 저는 DevOps 문화를 내재화하여 개발과 운영의 경계를 허물고 생산성을 극대화하는 데 주력해 왔습니다. AWS(EC2, S3) 클라우드 환경을 기반으로 안정적인 인프라를 구성하는 것은 물론, Docker를 적극적으로 활용하여 로컬부터 운영 서버까지 파편화될 수 있는 개발 환경을 완벽하게 표준화했습니다. 여기에 Jenkins를 연동한 CI/CD 파이프라인을 구축하여 휴먼 에러를 원천 차단하고, 빠르고 안전한 배포 자동화를 실현해 개발 리드 타임을 크게 단축했습니다. 또한, 안정적인 서비스 운영을 위해서는 선제적인 모니터링이 필수적이라는 판단하에 Linux(CentOS) 환경에서 Zabbix Server를 배포하고 SNMP 에이전트와 연동하여 강력한 서버 모니터링 체계를 구축했습니다. 특히 특정 애플리케이션 장애 발생 시 Shell Script가 자동으로 트리거되어 시스템을 복구하는 자동화 로직을 구현함으로써 시스템 가용성을 크게 높였습니다. 최근에는 Mac Mini를 활용한 로컬 서버 환경에서 macOS 네이티브 스케줄러(launchd)와 SSH 터널링을 결합하여 사내 전사 인프라 자동화 시스템을 구축하는 등, 클라우드와 온프레미스를 가리지 않고 인프라의 안정성과 운영 효율성을 한 차원 끌어올릴 수 있는 깊은 전문성을 보유하고 있습니다.

- blurb-title: Data
  blurb-content: 대용량 데이터 처리부터 AI 융합까지, 비즈니스 인사이트 창출의 핵심, 현대의 비즈니스에서 데이터는 가장 강력한 나침반이며, 저는 수집된 원천 데이터를 가공하여 유의미한 비즈니스 인사이트로 탈바꿈시키는 데이터 엔지니어링 및 분석에 탁월한 역량을 갖추고 있습니다. 주식회사 넷틴스 재직 당시, 전국 가맹점에서 월평균 100만 건 이상 쏟아지는 대용량 트랜잭션 데이터를 지연 없이 적재하고 실시간으로 조회할 수 있도록 MSSQL 스키마를 고도화하고 인덱스(Index) 전략을 최적화하여 쿼리 처리 성능을 비약적으로 개선한 경험이 있습니다. 이커머스 도메인에서는 데이터 기반의 의사결정을 지원하기 위해 Salesforce CDP 스크립트를 커스터마이징하여 전사적인 사용자 이벤트 추적 파이프라인을 완성했습니다. 이렇게 수집된 방대한 데이터를 Google BigQuery와 연동하고, Tableau를 활용해 Cohort 및 AARRR 퍼널 등 비즈니스 대시보드를 시각화하여 유관 부서의 마케팅 전략 수립에 직접적으로 기여했습니다. 최근에는 데이터의 활용 가치를 극대화하기 위해 생성형 AI(Claude API)를 데이터 파이프라인에 접목하는 혁신적인 시도를 성공적으로 이끌었습니다. 자사몰 데이터와 네이버 쇼핑 오픈 API로 수집한 경쟁사 최저가 데이터를 LLM과 결합하여 타겟팅된 마케팅 콘텐츠를 무중단으로 자동 배포하고, 가격 변동 시 즉각 메일을 발송하는 실시간 자동화 시스템을 구축했습니다. 저는 단순히 방대한 데이터를 안정적으로 다루는 백엔드 기술력을 넘어, 수집된 데이터를 깊이 있게 분석하고 최신 AI 기술과 결합하여 새로운 비즈니스 가치를 창출해 내는 융합형 인재입니다.

