<!-- Custom CSS for Header -->
<style>
  /* 글래스모피즘 (반투명 블러 효과) 적용 */
  .glass-header {
    background-color: rgba(0, 0, 0, 0.15) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
  }
  
  /* 마우스 오버 및 활성화된 메뉴 하단 애니메이션 라인 */
  .custom-nav-link {
    position: relative;
    padding-bottom: 5px;
    margin: 0 10px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.3s ease;
  }
  
  .custom-nav-link::after {
    content: '';
    position: absolute;
    width: 0;
    height: 2px;
    bottom: 0;
    left: 50%;
    background-color: #ffffff;
    transition: all 0.3s ease-in-out;
    transform: translateX(-50%);
    border-radius: 2px;
  }
  
  .custom-nav-link:hover::after,
  .nav-item.active .custom-nav-link::after {
    width: 100%;
  }

  /* 로고 호버 효과 */
  .navbar-brand {
    transition: transform 0.3s ease;
  }
  .navbar-brand:hover {
    transform: scale(1.05);
  }
</style>

<header class="navigation fixed-top glass-header">
  <!-- container를 추가해 다른 섹션들(About, Portfolio 등)과 좌우 여백을 맞춥니다. -->
  <nav class="navbar navbar-expand-lg navbar-dark container py-3">
    
    <!-- 로고 영역 -->
    <a class="navbar-brand font-tertiary h3 mb-0" href="{{ site.baseurl }}/">
      {% if site.data.settings.logo %}
        <img src="{{ site.data.settings.logo | absolute_url }}" alt="{{ site.data.settings.title }}" style="max-height: 40px;">
      {% else %}
        <!-- 문법 오류 수정: else if -> else -->
        <h3 class="text-white font-tertiary mb-0 font-weight-bold">{{ site.data.settings.title }}</h3>
      {% endif %}
    </a>
    
    <!-- 모바일 환경을 위한 반응형 햄버거 버튼 복구 및 디자인 개선 -->
    <button class="navbar-toggler border-0 shadow-none" type="button" data-toggle="collapse" data-target="#navigation"
      aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- 네비게이션 링크 영역 -->
    <div class="collapse navbar-collapse text-center" id="navigation">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item active">
          <a class="nav-link custom-nav-link text-white" href="{{ site.baseurl }}/">Home</a>
        </li>
        {% for link in site.data.settings.menu %}
          <li class="nav-item {{ class }}">
            <a class="nav-link custom-nav-link text-white" href="{{ link.link }}">{{ link.name }}</a>
          </li>
        {% endfor %}
      </ul>
    </div>
    
  </nav>
</header>
