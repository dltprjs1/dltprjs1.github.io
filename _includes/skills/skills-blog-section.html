<style>
  .tech-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .tech-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
  }
  .tech-badge {
    transition: all 0.2s ease-in-out;
    cursor: default;
  }
  .tech-badge:hover {
    transform: translateY(-3px) scale(1.05);
  }
</style>

<!-- Skills / Work Process -->
<section class="section py-5 bg-light">
  <div class="container">
    
    <div class="row">
      <div class="col-12 text-center mb-5">
        <h2 class="section-title font-weight-bold text-dark">Skills</h2>
      </div>
    </div>
    
    <div class="row justify-content-center">
      <!-- About, Portfolio 섹션과 동일한 최대 너비(col-lg-10) 적용 -->
      <div class="col-lg-12">
        
        <!-- BACKEND Card -->
        <div class="card tech-card border-0 shadow-sm mb-4 border-primary" style="border-radius: 16px; border-left-width: 6px !important; border-left-style: solid;">
          <div class="card-body p-4 p-md-5 bg-white" style="border-radius: 16px;">
            <h3 class="font-weight-bold text-dark mb-4 pb-3" style="border-bottom: 2px solid #f0f2f5;">
              <span class="text-primary mr-2"><i class="fas fa-server"></i></span> BACKEND
            </h3>
            <div class="d-flex flex-wrap" style="gap: 10px;">
              {% for Backend in site.data.settings.Backend-process %}
              <span class="tech-badge badge bg-white text-primary border border-primary px-3 py-2" style="font-size: 14px; border-radius: 20px;">
                {{ Backend.title }}
              </span>
              {% endfor %}
            </div>
          </div>
        </div>

        <!-- INFRASTRUCTURE Card -->
        <div class="card tech-card border-0 shadow-sm mb-4 border-success" style="border-radius: 16px; border-left-width: 6px !important; border-left-style: solid;">
          <div class="card-body p-4 p-md-5 bg-white" style="border-radius: 16px;">
            <h3 class="font-weight-bold text-dark mb-4 pb-3" style="border-bottom: 2px solid #f0f2f5;">
              <span class="text-success mr-2"><i class="fas fa-network-wired"></i></span> INFRASTRUCTURE
            </h3>
            <div class="d-flex flex-wrap" style="gap: 10px;">
              {% for Infra in site.data.settings.Infra-process %}
              <span class="tech-badge badge bg-white text-success border border-success px-3 py-2" style="font-size: 14px; border-radius: 20px;">
                {{ Infra.title }}
              </span>
              {% endfor %}
            </div>
          </div>
        </div>

        <!-- DATA Card -->
        <div class="card tech-card border-0 shadow-sm mb-4 border-info" style="border-radius: 16px; border-left-width: 6px !important; border-left-style: solid;">
          <div class="card-body p-4 p-md-5 bg-white" style="border-radius: 16px;">
            <h3 class="font-weight-bold text-dark mb-4 pb-3" style="border-bottom: 2px solid #f0f2f5;">
              <span class="text-info mr-2"><i class="fas fa-database"></i></span> DATA
            </h3>
            <div class="d-flex flex-wrap" style="gap: 10px;">
              {% for Data in site.data.settings.Data-process %}
              <span class="tech-badge badge bg-white text-info border border-info px-3 py-2" style="font-size: 14px; border-radius: 20px;">
                {{ Data.title }}
              </span>
              {% endfor %}
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
