<!-- Custom CSS for Hover Animation -->
<style>
  .tech-card {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .tech-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.08) !important;
  }
  .tech-badge {
    transition: all 0.2s ease-in-out;
    cursor: default;
    margin: 1px;
  }
  .tech-badge:hover {
    transform: translateY(-3px) scale(1.05);
  }
</style>

<!-- Work Process -->
<section class="section py-5 bg-light">
  <div class="container">
    <div class="row justify-content-center">
      
      <!-- BACKEND Card -->
      <div class="col-lg-10 mb-4">
        <div class="tech-card bg-white p-4 rounded-4 shadow-sm border-0">
          <h4 class="border-bottom pb-2 mb-4 text-primary fw-bold" style="font-size: 18px;">
            💻 BACKEND
          </h4>
          <div class="d-flex flex-wrap gap-3 justify-content-start px-2">
            {% for Backend in site.data.settings.Backend-process %}
            <span class="tech-badge badge bg-primary bg-opacity-10 text-white border border-primary px-4 py-2 mt-1 ms-1 rounded-pill shadow-sm" style="font-size: 15px; font-weight: 600;">
              {{ Backend.title }}
            </span>
            {% endfor %}
          </div>
        </div>
      </div>

      <!-- INFRASTRUCTURE Card -->
      <div class="col-lg-10 mb-4">
        <div class="tech-card bg-white p-4 rounded-4 shadow-sm border-0">
          <h4 class="border-bottom pb-2 mb-4 text-success fw-bold" style="font-size: 18px;">
            ☁️ INFRASTRUCTURE
          </h4>
          <div class="d-flex flex-wrap gap-3 justify-content-start px-2">
            {% for Infra in site.data.settings.Infra-process %}
            <span class="tech-badge badge bg-success bg-opacity-10 border border-success px-4 py-2 mt-1 ms-1 rounded-pill shadow-sm" style="font-size: 15px; font-weight: 600;">
              {{ Infra.title }}
            </span>
            {% endfor %}
          </div>
        </div>
      </div>

      <!-- DATA Card -->
      <div class="col-lg-10 mb-4">
        <div class="tech-card bg-white p-4 rounded-4 shadow-sm border-0">
          <h4 class="border-bottom pb-2 mb-4 text-info fw-bold" style="font-size: 18px;">
            📊 DATA
          </h4>
          <div class="d-flex flex-wrap gap-3 justify-content-start px-2">
            {% for Data in site.data.settings.Data-process %}
            <span class="tech-badge badge bg-info bg-opacity-10 text-white border border-info px-4 py-2 mt-1 ms-1 rounded-pill shadow-sm" style="font-size: 15px; font-weight: 600;">
              {{ Data.title }}
            </span>
            {% endfor %}
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
<!-- ./Work Process -->
