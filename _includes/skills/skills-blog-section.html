<!-- Work Process -->
<section class="section">
  <div class="container">
    <div class="row justify-content-around">
      <div class="col-lg-12 text-center">
        <h2 class="section-title">BACKEND</h2>
      </div>
      {% for Backend in site.data.settings.Backend-process %}
      <div class="col-lg-2 col-md-4 text-center hover-shadow pt-3">
        <h4 class="badge bg-primary text-white rounded-3 mb-1 px-3 py-3" style="
    font-size: 17px;">{{ Backend.title }}</h4>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="row justify-content-around">
      <div class="col-lg-12 text-center">
        <h2 class="section-title">INFRASTRUCTURE</h2>
      </div>
      {% for Infra in site.data.settings.Infra-process %}
      <div class="col-lg-2 col-md-4 text-center hover-shadow pt-3">
        <h4 class="badge bg-success rounded-3 mb-1 px-3 py-3" style="
    font-size: 17px;">{{ Infra.title }}</h4>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="row justify-content-around">
      <div class="col-lg-12 text-center">
        <h2 class="section-title">DATA</h2>
      </div>
      {% for Data in site.data.settings.Data-process %}
      <div class="col-lg-2 col-md-4 text-center hover-shadow pt-3">
        <h4 class="badge bg-info text-dark rounded-3 mb-1 px-3 py-3" style="
    font-size: 17px;">{{ Data.title }}</h4>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ./Work Process -->
