<!-- portfolio -->
<section class="section py-5 bg-light">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center mb-5">
        <h2 class="section-title font-weight-bold text-dark">Portfolio</h2>
      </div>
    </div>
    
    <div class="row justify-content-center">
      <!-- About 섹션과 동일하게 최대 너비를 col-lg-10으로 맞춰 시각적 안정감을 줍니다. -->
      <div class="col-lg-12">
        
        {% for item in site.data.settings.portfolio-home-items %}
        {% assign idx = forloop.index %}
        
        <!-- Card: About 섹션과 동일한 둥근 모서리, 그림자, 왼쪽 포인트 테두리 적용 -->
        <div class="card border-0 shadow-sm mb-5 border-primary" style="border-radius: 16px; border-left-width: 6px !important; border-left-style: solid;">
          <div class="card-body p-4 p-md-5 bg-white" style="border-radius: 16px;">
            
            <!-- 헤더 영역: 타이틀과 팀(소속) 뱃지를 양쪽으로 배치 -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-2">
              <h3 class="font-weight-bold text-dark mb-3 mb-md-0">{{ item.title }}</h3>
              <span class="badge badge-info px-3 py-2" style="font-size: 14px; border-radius: 20px;">
                {{ item.team }}
              </span>
            </div>
            
            <!-- 날짜 영역: 하단에 얇은 선을 그어 헤더와 본문을 분리 -->
            <p class="text-muted mb-4 pb-3" style="font-size: 14px; border-bottom: 2px solid #f0f2f5;">
              <i class="fas fa-calendar-alt mr-2"></i>{{ item.date }}
            </p>
            
            <!-- 본문 내용: About 섹션과 동일한 가독성 설정 및 줄바꿈 필터 적용 -->
            <p class="text-secondary mb-4 pb-2" style="font-size: 16.5px; line-height: 1.8; letter-spacing: -0.3px; word-break: keep-all;">
              {{ item.contents | newline_to_br }}
            </p>
            
            <!-- 태그 영역: 트렌디한 라인(Border) 스타일의 둥근 뱃지 디자인 적용 -->
            <div class="d-flex flex-wrap" style="gap: 10px;">
              {% for tag in item.tags %}
              <span class="badge badge-light text-primary border border-primary px-3 py-2" style="font-size: 13px; border-radius: 20px;">
                # {{ tag }}
              </span>
              {% endfor %}
            </div>
            
          </div>
        </div>
        {% endfor %}
        
      </div>
    </div>
  </div>
</section>
<!-- /portfolio -->
