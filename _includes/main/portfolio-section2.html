<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h2 class="section-title">Portfolio</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-4">
        <div class="list-group" id="list-tab" role="tablist">
          {% for item in site.data.settings.portfolio-home-items %}
          {% assign idx = forloop.index %}
          <a class="list-group-item list-group-item-action {% if forloop.first %}active{% endif %}"
             id="list-item-{{ idx }}-list"
             data-toggle="list"
             href="#list-item-{{ idx }}"
             role="tab"
             aria-controls="list-item-{{ idx }}">
            {{ item.contents }}
          </a>
          {% endfor %}
        </div>
      </div>
      <div class="col-8">
        <div class="tab-content" id="nav-tabContent">
          {% for item in site.data.settings.portfolio-home-items %}
          {% assign idx = forloop.index %}
          <div class="tab-pane fade {% if forloop.first %}show active{% endif %}"
               id="list-item-{{ idx }}"
               role="tabpanel"
               aria-labelledby="list-item-{{ idx }}-list">
            {{ item.contents }}
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
