<div class="row">
  <div class="col-4">
    <div class="list-group" id="list-tab" role="tablist">
      {% for item in site.data.settings.portfolio-home-items %}
      <a class="list-group-item list-group-item-action active" id="list-home-list" data-bs-toggle="list" href="#list-home" role="tab" aria-controls="list-home">{{ item.contents }}</a>
      {% endfor %}
    </div>
  </div>
  <div class="col-8">
    <div class="tab-content" id="nav-tabContent">
      {% for item in site.data.settings.portfolio-home-items %}
      <div class="tab-pane fade show active" id="list-home" role="tabpanel" aria-labelledby="list-home-list">{{ item.contents }}</div>
      {% endfor %}
    </div>
  </div>
</div>
