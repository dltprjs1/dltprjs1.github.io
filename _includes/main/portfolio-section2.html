<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h2 class="section-title">Portfolio</h2>
      </div>
    </div>
    <div class="row">
      <div class="col-12">
        <div id="portfolio-accordion">
          {% for item in site.data.settings.portfolio-home-items %}
          {% assign idx = forloop.index %}
          <a class="list-group-item list-group-item-action"
             data-toggle="collapse"
             href="#list-item-{{ idx }}"
             role="button">
            {{ item.title }}
          </a>
          <div class="collapse {% if forloop.index == 1 %}show{% endif %}"
               id="list-item-{{ idx }}"
               data-parent="#portfolio-accordion">
            <div class="p-3 border-left border-primary ml-2">
              <h5 class="font-weight-bold">{{ item.title }}</h5>
              <p class="text-muted mb-1">{{ item.date }}</p>
              <p class="text-muted mb-2">{{ item.team }}</p>
              <div>
                {% for tag in item.tags %}
                <span class="badge badge-primary mr-1 mb-1">{{ tag }}</span>
                {% endfor %}
              </div>
              <h5 class="font-weight-bold">{{ item.contents }}</h5>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>
    </div>
  </div>
</section>
