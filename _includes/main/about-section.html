<!-- about -->
<section class="section py-5 bg-light">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center mb-5">
        <h2 class="section-title font-weight-bold text-dark">About Me</h2>
      </div>
    </div>
    <div class="row justify-content-center">
      <!-- 중앙 정렬 및 최대 너비 고정 -->
      <div class="col-lg-12">
        
        {% for item in site.data.settings.blurb %}
        <!-- Card -->
        <div class="card border-0 shadow-sm mb-5 border-primary" style="border-radius: 16px; border-left-width: 6px !important; border-left-style: solid;">
          <div class="card-body p-4 p-md-5 bg-white" style="border-radius: 16px;">
            
            <!-- 제목 -->
            <h3 class="font-weight-bold text-dark mb-4 pb-3" style="border-bottom: 2px solid #f0f2f5;">
              {{ item.blurb-title }}
            </h3>
            
            <!-- 내용 (줄바꿈이 적용되도록 필터 추가) -->
            <p class="text-secondary mb-0" style="font-size: 16.5px; line-height: 1.8; letter-spacing: -0.3px; word-break: keep-all;">
              {{ item.blurb-content | newline_to_br }}
            </p>
            
          </div>
        </div>
        {% endfor %}
        
      </div>
    </div>
  </div>
</section>
<!-- /about -->
